# CI/CD Pipeline Definition
# Supports GitHub Actions, GitLab CI, and generic pipeline runners

name: AI Call Center CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

pipeline:
  stages:
    - setup
    - install
    - lint
    - test
    - package

  steps:
    - name: Setup Environment
      command: python -m pip install --upgrade pip setuptools wheel

    - name: Install Dependencies
      command: pip install -r requirements.txt

    - name: Syntax & Lint Verification
      command: python -m compileall -q .

    - name: Run Test Suite
      command: python -m unittest -v test_app.py

    - name: Maven Build & Dependency Check
      command: mvn test-compile
