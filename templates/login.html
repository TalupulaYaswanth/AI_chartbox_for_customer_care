<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Apex AI Call Center</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap');

        :root {
            --bg: #000000;
            --surface: #0a0a0a;
            --border-glass: rgba(255, 255, 255, 0.12);
            --primary: #ffffff;
            --text-main: #ffffff;
            --text-muted: #888888;
            --danger: #ff3b30;
            --success: #34c759;
            --radius: 12px;
            --transition: all 0.25s ease;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: 'Outfit', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Grid background effect */
        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 24px 24px;
            z-index: -1;
        }

        .login-card {
            background: var(--surface);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius);
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .login-header {
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .login-header i {
            font-size: 2.5rem;
            color: var(--primary);
        }

        .login-header h2 {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .login-header p {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .auth-tabs {
            display: flex;
            border-bottom: 1px solid var(--border-glass);
            margin-bottom: 10px;
        }

        .auth-tab {
            flex: 1;
            padding: 12px;
            background: none;
            border: none;
            color: var(--text-muted);
            font-weight: 600;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: var(--transition);
            font-family: inherit;
            font-size: 0.95rem;
        }

        .auth-tab.active {
            color: #ffffff;
            border-bottom-color: #ffffff;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
        }

        .form-input {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-glass);
            border-radius: 8px;
            padding: 12px 16px;
            color: #ffffff;
            font-size: 1rem;
            outline: none;
            transition: var(--transition);
        }

        .form-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.1);
        }

        .btn {
            background: var(--primary);
            color: #000000;
            border: none;
            border-radius: 8px;
            padding: 14px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: var(--transition);
        }

        .btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .alert-box {
            border-radius: 8px;
            padding: 12px;
            font-size: 0.85rem;
            display: none;
            align-items: center;
            gap: 8px;
            line-height: 1.4;
        }

        .alert-box.danger {
            background: rgba(255, 59, 48, 0.1);
            border: 1px solid var(--danger);
            color: var(--danger);
        }

        .alert-box.success {
            background: rgba(52, 199, 89, 0.1);
            border: 1px solid var(--success);
            color: var(--success);
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-header">
            <i class="fa-solid fa-microphone-lines"></i>
            <h2>Owner Portal Access</h2>
            <p id="header-desc">Please log in to manage database and telemetry</p>
        </div>

        <!-- Toggle Tabs -->
        <div class="auth-tabs">
            <button type="button" class="auth-tab active" id="tab-signin">Sign In</button>
            <button type="button" class="auth-tab" id="tab-signup">Sign Up</button>
        </div>

        <div class="alert-box danger" id="alert-box">
            <i class="fa-solid fa-triangle-exclamation"></i>
            <span id="alert-text">Invalid credentials</span>
        </div>

        <form id="auth-form">
            <div class="form-group" style="margin-bottom: 16px;">
                <label for="username">Username</label>
                <input type="text" id="username" class="form-input" placeholder="admin" required value="admin">
            </div>

            <!-- Email field only visible on Sign Up -->
            <div class="form-group" id="email-group" style="margin-bottom: 16px; display: none;">
                <label for="email">Owner Gmail (For Alert Notifications)</label>
                <input type="email" id="email" class="form-input" placeholder="owner@gmail.com">
            </div>

            <div class="form-group" style="margin-bottom: 24px;">
                <label for="password">Password</label>
                <input type="password" id="password" class="form-input" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn" id="submit-btn">
                <span id="btn-text">Sign In</span> <i class="fa-solid fa-arrow-right"></i>
            </button>
        </form>
    </div>

    <script>
        const authForm = document.getElementById("auth-form");
        const alertBox = document.getElementById("alert-box");
        const alertText = document.getElementById("alert-text");
        const tabSignin = document.getElementById("tab-signin");
        const tabSignup = document.getElementById("tab-signup");
        const emailGroup = document.getElementById("email-group");
        const submitBtn = document.getElementById("submit-btn");
        const btnText = document.getElementById("btn-text");
        const headerDesc = document.getElementById("header-desc");

        let activeMode = "signin"; // "signin" or "signup"

        tabSignin.addEventListener("click", () => {
            activeMode = "signin";
            tabSignin.classList.add("active");
            tabSignup.classList.remove("active");
            emailGroup.style.display = "none";
            btnText.innerText = "Sign In";
            headerDesc.innerText = "Please log in to manage database and telemetry";
            alertBox.style.display = "none";
        });

        tabSignup.addEventListener("click", () => {
            activeMode = "signup";
            tabSignup.classList.add("active");
            tabSignin.classList.remove("active");
            emailGroup.style.display = "flex";
            btnText.innerText = "Register & Sign Up";
            headerDesc.innerText = "Register new administrator credentials in the dataset";
            alertBox.style.display = "none";
        });

        authForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;
            const email = document.getElementById("email").value;

            const url = activeMode === "signin" ? "/api/login" : "/api/signup";
            const bodyData = activeMode === "signin" 
                ? { username, password }
                : { username, password, email };

            try {
                const res = await fetch(url, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(bodyData)
                });
                const data = await res.json();
                
                if (res.ok && data.success) {
                    if (activeMode === "signin") {
                        // Set local storage flag and redirect
                        localStorage.setItem("owner_logged_in", "true");
                        window.location.href = data.redirect || "/";
                    } else {
                        // Registration success - switch back to sign in with success alert
                        alertBox.className = "alert-box success";
                        alertText.innerText = data.message + " You can now sign in.";
                        alertBox.style.display = "flex";
                        tabSignin.click(); // Reset to signin view
                    }
                } else {
                    alertBox.className = "alert-box danger";
                    alertText.innerText = data.error || "Authentication failed.";
                    alertBox.style.display = "flex";
                }
            } catch (err) {
                alertBox.className = "alert-box danger";
                alertText.innerText = "Network error. Please try again.";
                alertBox.style.display = "flex";
            }
        });
    </script>
</body>
</html>
